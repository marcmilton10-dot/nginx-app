server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Lets index.html print the container hostname
    ssi on;

    # Used by the ALB target group and Docker health check
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
